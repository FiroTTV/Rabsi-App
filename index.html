<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Rabsi – Nail Streak 💅</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a1a2e">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<!-- Konfetti Animation -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
:root {
    --bg-gradient: linear-gradient(135deg, #2b1d3a, #1e1e2f, #2a1f4f);
    --accent: #7a5cff;
    --success: #7be495;
    --fail: #ff8a8a;
    --card-bg: rgba(30, 27, 46, 0.95);
}

html, body {
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background: var(--bg-gradient);
    color: #ffffff;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
}

#stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
}
.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: radial-gradient(circle, #fff, #c7b3ff);
    border-radius: 50%;
    animation: floatStar linear infinite;
}
@keyframes floatStar {
    from { transform: translateY(100vh); opacity: 0; }
    50% { opacity: 1; }
    to { transform: translateY(-10vh); opacity: 0; }
}

/* App Container */
.app-container {
    position: relative;
    z-index: 2;
    max-width: 500px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

/* Screen Layouts */
.screen {
    flex: 1;
    padding: 20px;
    padding-bottom: 90px;
    display: none;
    animation: fadeIn 0.3s ease;
}
.screen.active {
    display: block;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

.login-box {
    background: var(--card-bg);
    border-radius: 28px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.05);
    margin-top: 20vh;
}

h1, h2, h3 { text-align: center; margin-top: 0; font-weight: 800; }
h1 { font-size: 1.5rem; margin-bottom: 20px; }

/* Bottom Navigation */
.bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: rgba(26, 26, 46, 0.9);
    backdrop-filter: blur(15px);
    display: flex;
    justify-content: space-around;
    padding: 10px 0 calc(env(safe-area-inset-bottom) + 10px) 0;
    border-top: 1px solid rgba(255,255,255,0.1);
    z-index: 100;
}
.nav-item {
    background: none; border: none; color: #888;
    font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 6px;
    width: 33%; cursor: pointer; transition: 0.3s; margin: 0; padding: 5px;
}
.nav-item .icon { font-size: 22px; transition: transform 0.2s; }
.nav-item.active { color: var(--accent); font-weight: 700; }
.nav-item.active .icon { transform: scale(1.15); }

/* Buttons & Inputs */
button {
    width: 100%; padding: 14px; border-radius: 16px; border: none;
    font-size: 15px; font-weight: 700; cursor: pointer; margin-bottom: 10px;
    transition: transform 0.1s, opacity 0.2s; color: white;
}
button:active { transform: scale(0.97); }
button:disabled { opacity: 0.4; cursor: not-allowed; }

.yes { background: var(--success); color: #000; box-shadow: 0 4px 15px rgba(123,228,149,0.3); }
.no  { background: var(--fail); color: #000; box-shadow: 0 4px 15px rgba(255,138,138,0.3); }
.btn-primary { background: #3a3a55; }
.btn-action { background: var(--accent); color: white; box-shadow: 0 4px 15px rgba(122,92,255,0.3); }

input, select {
    width: 100%; padding: 14px; border-radius: 12px; border: none;
    margin-bottom: 12px; background: #2a2a3d; color: white;
    font-size: 16px; box-sizing: border-box; outline: none;
}
input:focus, select:focus { outline: 2px solid var(--accent); }

/* Home Screen Elements */
.nav-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 16px; background: rgba(255,255,255,0.05); border-radius: 14px; padding: 6px;
}
.nav-btn {
    width: 42px; height: 42px; background: var(--accent); border-radius: 10px;
    font-size: 18px; display: flex; align-items: center; justify-content: center; margin: 0;
}
.subtitle { font-weight: 700; color: #aaa; }

.streak {
    text-align: center; background: #2a2a3d; border-radius: 16px;
    padding: 16px; margin-bottom: 20px; font-size: 22px; font-weight: 700;
    border: 1px solid rgba(122,92,255,0.2);
}

.buttons { display: flex; gap: 12px; margin-bottom: 20px; }
.buttons button { width: 50%; margin-bottom: 0; }

.weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr); font-size: 11px;
    text-align: center; opacity: 0.6; margin-bottom: 8px;
}
.calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 20px; }
.day {
    aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center;
    justify-content: center; font-weight: 600; background: #333; font-size: 13px;
}
.future  { background: #444; opacity: 0.2; }
.success { background: var(--success) !important; color: #000; }
.fail     { background: var(--fail) !important; color: #000; }
.today   { outline: 2px solid var(--accent); outline-offset: -2px; }

.gift {
    text-align: center; padding: 18px; border-radius: 16px;
    background: #2a2a3d; transition: all 0.3s ease;
}
.locked { color: #888; border: 1px dashed #444; font-size: 14px; }
.unlocked {
    background: linear-gradient(135deg, #ffd700, #ffa500); color: #000;
    font-weight: 800; box-shadow: 0 0 20px rgba(255, 215, 0, 0.4); transform: scale(1.02);
}

/* Community Screen */
.community-card {
    background: rgba(255,255,255,0.05); border-radius: 16px; padding: 15px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; border: 1px solid rgba(255,255,255,0.02);
}
.user-info { display: flex; align-items: center; gap: 10px; font-weight: 600; }
.avatar { width: 40px; height: 40px; background: #3a3a55; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; }
.streak-badge { background: #2a2a3d; padding: 6px 12px; border-radius: 20px; font-weight: 800; border: 1px solid var(--accent); color: var(--accent); }

/* Profile Screen */
.card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 20px; }
.stats-detail-box { background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px; margin-bottom: 15px; font-size: 14px; text-align: center; }
hr { border: 0.5px solid #333; margin: 20px 0; }
.hidden { display: none !important; }

#adminToggle { background: transparent; border: 1px solid #444; color: #888; font-size: 13px; }

/* Nickname Section Layout */
.input-group { display: flex; gap: 10px; margin-bottom: 10px; }
.input-group input { margin-bottom: 0; }
.input-group button { width: auto; padding: 14px 20px; margin-bottom: 0; }
</style>
</head>

<body>
<div id="stars"></div>

<div class="app-container">
    
    <!-- LOGIN SCREEN -->
    <div class="screen active" id="loginScreen">
        <div class="login-box">
            <h1>💜 Rabsi Login</h1>
            <input id="email" type="email" placeholder="E-Mail" autocomplete="email">
            <input id="password" type="password" placeholder="Passwort">
            <button class="yes" id="loginBtn" onclick="login()">Einloggen / Registrieren</button>
            <button onclick="resetPassword()" style="background: transparent; color: #aaa; font-size: 13px; margin-top: 5px; box-shadow: none; padding: 10px;">Passwort vergessen?</button>
        </div>
    </div>

    <!-- MAIN APP WRAPPER (Swipeable Area) -->
    <div id="mainApp" class="hidden">
        
        <!-- TAB 1: HOME -->
        <div class="screen active" id="tabHome">
            <h1>🔥 Rabsi's Streak</h1>
            
            <div class="nav-header">
                <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
                <div class="subtitle" id="monthTitle"></div>
                <button class="nav-btn" onclick="changeMonth(1)">▶</button>
            </div>

            <div class="streak" id="streakBox">🔥 0 Tage Streak</div>

            <div class="weekdays">
                <div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div>
            </div>
            <div class="calendar" id="calendar"></div>

            <div class="buttons">
                <button class="yes" id="btnYes">Laden...</button>
                <button class="no" id="btnNo">Laden...</button>
            </div>

            <div class="gift locked" id="giftBox">🔒 Lädt...</div>
        </div>

        <!-- TAB 2: COMMUNITY -->
        <div class="screen" id="tabCommunity">
            <h1>🌍 Freunde</h1>
            <p style="text-align:center; color:#aaa; font-size:14px; margin-bottom:20px;">Schau, wie gut die anderen durchhalten!</p>
            <div id="communityList">
                <!-- User Cards will be injected here -->
            </div>
        </div>

        <!-- TAB 3: PROFIL & STATS -->
        <div class="screen" id="tabProfile">
            <h1>👤 Profil</h1>
            
            <!-- Install PWA Button (Versteckt bis ready) -->
            <button id="installBtn" class="btn-action hidden" onclick="installApp()">App installieren 📱</button>

            <div class="card">
                <h2 style="font-size: 1.2rem;">✏️ Nickname</h2>
                <p style="font-size: 13px; color: #aaa; margin-top: -10px; margin-bottom: 15px;">Wie sollen dich andere in der Liste sehen?</p>
                <div class="input-group">
                    <input id="nicknameInput" type="text" placeholder="Dein Name">
                    <button class="btn-primary" onclick="saveNickname()">Speichern</button>
                </div>
            </div>

            <div class="card">
                <h2 style="font-size: 1.2rem;">📊 Statistik</h2>
                <select id="monthSelect"></select>
                <div id="statsSummary" class="stats-detail-box"></div>
                <div class="calendar" id="statsGrid" style="margin-bottom:10px"></div>
            </div>

            <div class="card">
                <h2 style="font-size: 1.2rem;">⚙️ Account</h2>
                <p style="font-size: 14px;"><b>E-Mail:</b> <span id="accEmail"></span><br>
                <b>Einträge:</b> <span id="accDays"></span></p>
                
                <button id="adminToggle" onclick="toggleAdmin()">👑 Admin-Modus: AUS</button>
                
                <div id="adminTools" class="hidden">
                    <hr>
                    <h3 style="font-size:1rem;">🔧 Admin Edit</h3>
                    <input id="editEmail" placeholder="User E-Mail">
                    <input id="editDate" type="date">
                    <select id="editValue">
                        <option value="success">✅ clean</option>
                        <option value="fail">❌ gekaut</option>
                        <option value="">⬜ löschen</option>
                    </select>
                    <button class="yes" onclick="adminEditProgress()">💾 Speichern</button>
                </div>

                <hr>
                <button onclick="logout()" style="background:transparent; color:#ff8a8a; font-size:14px; border:1px solid #ff8a8a;">🚪 Abmelden</button>
            </div>
        </div>

        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">
            <button onclick="switchTab('tabHome')" class="nav-item active">
                <span class="icon">🏠</span>
                Home
            </button>
            <button onclick="switchTab('tabCommunity')" class="nav-item">
                <span class="icon">🌍</span>
                Freunde
            </button>
            <button onclick="switchTab('tabProfile')" class="nav-item">
                <span class="icon">👤</span>
                Profil
            </button>
        </nav>
    </div>

</div>

<script>
/* ===== PWA INSTALL LOGIC ===== */
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBtn').classList.remove('hidden');
});

async function installApp() {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
            document.getElementById('installBtn').classList.add('hidden');
        }
        deferredPrompt = null;
    }
}

/* ===== FIREBASE & STARS SETUP ===== */
const firebaseConfig = {
  apiKey: "AIzaSyBjc2ti7FM5hRIzMrMxOsLIA_K5ulBRP3w",
  authDomain: "rabsi-nail-streak.firebaseapp.com",
  projectId: "rabsi-nail-streak",
  appId: "1:261656631522:web:9b79c2cbc0e1e8790126bb"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let data = {};
let isAdmin = localStorage.getItem("rabsiAdmin") === "1";
let displayDate = new Date();
displayDate.setDate(1); 
const today = new Date();

// Star Background Animation
const starsContainer = document.getElementById("stars");
for (let i = 0; i < 40; i++) {
    const s = document.createElement("div"); s.className = "star";
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (15 + Math.random() * 15) + "s";
    s.style.animationDelay = (Math.random() * 10) + "s";
    starsContainer.appendChild(s);
}

/* ===== APP NAVIGATION & SWIPE LOGIC ===== */
const tabOrder = ['tabHome', 'tabCommunity', 'tabProfile'];
let currentTabIndex = 0;
let touchStartX = 0;
let touchStartY = 0;
let touchEndX = 0;
let touchEndY = 0;

const mainApp = document.getElementById('mainApp');

mainApp.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
}, {passive: true});

mainApp.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    touchEndY = e.changedTouches[0].screenY;
    handleSwipe();
}, {passive: true});

function handleSwipe() {
    const diffX = touchStartX - touchEndX;
    const diffY = touchStartY - touchEndY;
    
    // Nur reagieren, wenn hauptsächlich horizontal gewischt wurde (nicht beim Scrollen)
    if (Math.abs(diffX) > Math.abs(diffY)) {
        if (diffX > 60) {
            // Nach links wischen -> Nächster Tab
            if (currentTabIndex < tabOrder.length - 1) switchTab(tabOrder[currentTabIndex + 1]);
        } else if (diffX < -60) {
            // Nach rechts wischen -> Vorheriger Tab
            if (currentTabIndex > 0) switchTab(tabOrder[currentTabIndex - 1]);
        }
    }
}

function switchTab(tabId) {
    if (navigator.vibrate) navigator.vibrate(30);

    // Update index für die Swipe-Logik
    currentTabIndex = tabOrder.indexOf(tabId);

    document.getElementById("tabHome").classList.remove("active");
    document.getElementById("tabCommunity").classList.remove("active");
    document.getElementById("tabProfile").classList.remove("active");
    
    document.getElementById(tabId).classList.add("active");
    
    document.querySelectorAll(".nav-item").forEach(btn => btn.classList.remove("active"));
    // Passenden Button in der Nav-Leiste markieren
    document.querySelector(`.nav-item[onclick*="${tabId}"]`).classList.add("active");

    if(tabId === "tabCommunity") {
        loadCommunity();
    }
}

/* ===== HELPER FUNCTIONS ===== */
function getTargetDate() {
    const now = new Date();
    const target = new Date(now);
    if (now.getHours() < 20) target.setDate(now.getDate() - 1);
    return target;
}

function formatDate(d) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function calculateStreakCount(userData) {
    let streak = 0;
    let check = new Date();
    if (userData[formatDate(check)] === undefined) check.setDate(check.getDate() - 1);
    
    while (userData[formatDate(check)] === "success") {
        streak++;
        check.setDate(check.getDate() - 1);
    }
    return streak;
}

/* ===== AUTH HANDLER ===== */
auth.onAuthStateChanged(user => {
    if (!user) {
        document.getElementById("loginScreen").classList.add("active");
        document.getElementById("mainApp").classList.add("hidden");
        return;
    }
    
    db.collection("users").doc(user.uid).set({ email: user.email }, { merge: true });

    document.getElementById("loginScreen").classList.remove("active");
    document.getElementById("mainApp").classList.remove("hidden");
    document.getElementById("accEmail").textContent = user.email;

    db.collection("users").doc(user.uid).onSnapshot(doc => {
        const docData = doc.data() || {};
        data = docData.streakData || {};
        
        const currentName = docData.displayName || user.email.split("@")[0];
        document.getElementById("nicknameInput").value = currentName;

        document.getElementById("accDays").textContent = Object.keys(data).length;
        updateAppView();
        updateAdminUI();
        applyTimeLock();
        buildStatsOptions(); 
    });
});

async function login() {
    const e = document.getElementById("email").value.trim(), p = document.getElementById("password").value.trim();
    const btn = document.getElementById("loginBtn");
    if (!e || !p) return alert("Daten eingeben");
    btn.disabled = true; btn.textContent = "Lädt...";
    try { await auth.signInWithEmailAndPassword(e, p); } catch (err) {
        try { await auth.createUserWithEmailAndPassword(e, p); } catch (regErr) { alert(regErr.message); }
    } finally { btn.disabled = false; btn.textContent = "Einloggen / Registrieren"; }
}

async function resetPassword() {
    const email = document.getElementById("email").value.trim();
    if (!email) return alert("Bitte gib zuerst deine E-Mail-Adresse in das Feld ein.");
    try {
        await auth.sendPasswordResetEmail(email);
        alert("E-Mail zum Zurücksetzen gesendet an " + email);
    } catch (error) { alert("Fehler: " + error.message); }
}

function logout() { auth.signOut(); }

/* ===== NICKNAME LOGIC ===== */
async function saveNickname() {
    const newName = document.getElementById("nicknameInput").value.trim();
    if (!newName) return alert("Bitte gib einen Namen ein.");
    
    const btn = document.querySelector("#nicknameInput + button");
    btn.textContent = "Lädt...";
    try {
        await db.collection("users").doc(auth.currentUser.uid).set({ displayName: newName }, { merge: true });
        btn.textContent = "Gespeichert!";
        setTimeout(() => btn.textContent = "Speichern", 2000);
    } catch(e) {
        alert("Fehler beim Speichern!");
        btn.textContent = "Speichern";
    }
}

/* ===== TAB 1: HOME LOGIC ===== */
function changeMonth(delta) {
    displayDate.setMonth(displayDate.getMonth() + delta);
    updateAppView();
}

function updateAppView() {
    document.getElementById("monthTitle").textContent = displayDate.toLocaleString("de-DE", { month: "long", year: "numeric" });
    buildCalendar();
    
    const currentStreak = calculateStreakCount(data);
    document.getElementById("streakBox").textContent = `🔥 ${currentStreak} Tage Streak`;
    
    checkGift();
}

function applyTimeLock() {
    const target = getTargetDate();
    const key = formatDate(target);
    const bY = document.getElementById("btnYes"), bN = document.getElementById("btnNo");
    
    const isToday = target.toDateString() === new Date().toDateString();
    const dayLabel = isToday ? "Heute" : "Gestern";
    
    if (data[key]) {
        bY.disabled = true; bN.disabled = true;
        bY.textContent = `${dayLabel}: ${data[key] === 'success' ? 'Erledigt ✅' : '-'}`;
        bN.textContent = `${dayLabel}: ${data[key] === 'fail' ? 'Gekaut ❌' : '-'}`;
    } else {
        bY.disabled = false; bN.disabled = false;
        bY.textContent = `${dayLabel} nicht gekaut ✅`;
        bN.textContent = `${dayLabel} gekaut ❌`;
    }
}

function buildCalendar() {
    const cal = document.getElementById("calendar");
    cal.innerHTML = "";
    const y = displayDate.getFullYear(), m = displayDate.getMonth();
    const offset = (new Date(y, m, 1).getDay() + 6) % 7;
    const dim = new Date(y, m + 1, 0).getDate();

    for (let i = 0; i < offset; i++) cal.appendChild(document.createElement("div"));
    for (let d = 1; d <= dim; d++) {
        const el = document.createElement("div"); el.className = "day"; el.textContent = d;
        const key = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const cDate = new Date(y, m, d);
        if (cDate > today) el.classList.add("future");
        if (data[key] === "success") el.classList.add("success");
        if (data[key] === "fail") el.classList.add("fail");
        if (y === today.getFullYear() && m === today.getMonth() && d === today.getDate()) el.classList.add("today");
        cal.appendChild(el);
    }
}

function saveToday(res) {
    const target = getTargetDate();
    const key = formatDate(target);
    if (data[key] && !isAdmin) return; 
    
    // VISUELLES & HAPTISCHES FEEDBACK
    if (res === "success") {
        if (navigator.vibrate) navigator.vibrate([80, 50, 80]); // 2x kurzes Vibrieren
        confetti({
            particleCount: 120,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#7be495', '#7a5cff', '#ffffff'] // Angepasst an App-Farben
        });
    } else if (res === "fail") {
        if (navigator.vibrate) navigator.vibrate(250); // 1x tiefes Vibrieren
    }

    data[key] = res;
    db.collection("users").doc(auth.currentUser.uid).set({ streakData: data }, { merge: true });
}

document.getElementById("btnYes").onclick = () => saveToday("success");
document.getElementById("btnNo").onclick = () => saveToday("fail");

function checkGift() {
    const giftBox = document.getElementById("giftBox");
    const y = displayDate.getFullYear(), m = displayDate.getMonth();
    const daysInMonth = new Date(y, m + 1, 0).getDate();
    let sCount = 0, hasFail = false;

    for (let d = 1; d <= daysInMonth; d++) {
        const k = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        if (data[k] === "success") sCount++;
        else if (data[k] === "fail") hasFail = true;
    }

    if (hasFail) {
        giftBox.className = "gift locked";
        giftBox.textContent = "❌ Monat verloren";
    } else if (sCount === daysInMonth) {
        giftBox.className = "gift unlocked";
        giftBox.innerHTML = "🎁 MONATSKÖNIGIN 🎉";
    } else {
        giftBox.className = "gift locked";
        giftBox.textContent = `🔒 Noch ${daysInMonth - sCount} Tage bis zum Geschenk 🎁`;
    }
}

/* ===== TAB 2: COMMUNITY LOGIC ===== */
async function loadCommunity() {
    const list = document.getElementById("communityList");
    list.innerHTML = "<p style='text-align:center;'>Lade Freunde...</p>";
    try {
        const snap = await db.collection("users").get();
        let html = "";
        
        let usersArray = [];
        snap.forEach(doc => {
            const d = doc.data();
            const emailStr = d.email || "Unbekannt";
            const name = d.displayName || emailStr.split("@")[0]; 
            const streakCount = calculateStreakCount(d.streakData || {});
            const isMe = (auth.currentUser && auth.currentUser.email === emailStr);
            usersArray.push({ name, streakCount, isMe });
        });
        
        usersArray.sort((a, b) => b.streakCount - a.streakCount);
        
        usersArray.forEach((u, index) => {
            let medal = "";
            if(index === 0 && u.streakCount > 0) medal = " 👑";
            if(index === 1 && u.streakCount > 0) medal = " 🥈";
            if(index === 2 && u.streakCount > 0) medal = " 🥉";

            html += `
                <div class="community-card" style="${u.isMe ? 'border: 1px solid var(--accent);' : ''}">
                    <div class="user-info">
                        <div class="avatar">${u.isMe ? '👤' : '💅'}</div>
                        <div>
                            ${u.name}${medal}
                            ${u.isMe ? '<div style="font-size:10px; color:var(--accent);">Du</div>' : ''}
                        </div>
                    </div>
                    <div class="streak-badge">🔥 ${u.streakCount}</div>
                </div>
            `;
        });
        
        list.innerHTML = html;
    } catch(e) {
        console.error(e);
        list.innerHTML = "<p style='text-align:center; color:var(--fail);'>Konnte Daten nicht laden.</p>";
    }
}

/* ===== TAB 3: PROFIL & ADMIN LOGIC ===== */
function toggleAdmin() {
    isAdmin = !isAdmin;
    localStorage.setItem("rabsiAdmin", isAdmin ? "1" : "0");
    updateAdminUI();
    applyTimeLock();
}

function updateAdminUI() { 
    document.getElementById("adminToggle").textContent = isAdmin ? "👑 Admin: AN" : "👑 Admin: AUS"; 
    document.getElementById("adminTools").style.display = isAdmin ? "block" : "none";
}

function buildStatsOptions() {
    const sel = document.getElementById("monthSelect");
    sel.innerHTML = "";
    const months = [...new Set(Object.keys(data).map(k => k.slice(0, 7)))].sort().reverse();
    if (months.length === 0) return document.getElementById("statsSummary").innerHTML = "Noch keine Einträge.";
    months.forEach(m => {
        const opt = document.createElement("option"); opt.value = m; opt.textContent = m;
        sel.appendChild(opt);
    });
    sel.onchange = () => renderStats(sel.value);
    renderStats(sel.value);
}

function renderStats(monthKey) {
    const grid = document.getElementById("statsGrid");
    grid.innerHTML = "";
    const [y, m] = monthKey.split("-").map(Number);
    const dim = new Date(y, m, 0).getDate();
    let s = 0, f = 0;
    for (let d = 1; d <= dim; d++) {
        const k = `${y}-${String(m).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const cell = document.createElement("div"); cell.className = "day"; cell.textContent = d;
        if (data[k] === "success") { cell.classList.add("success"); s++; }
        if (data[k] === "fail") { cell.classList.add("fail"); f++; }
        grid.appendChild(cell);
    }
    document.getElementById("statsSummary").innerHTML = `🟢 Clean: <b>${s}</b> | 🔴 Gekaut: <b>${f}</b>`;
}

async function adminEditProgress() {
    const email = document.getElementById("editEmail").value.trim();
    const date = document.getElementById("editDate").value;
    const val = document.getElementById("editValue").value;
    if (!email || !date) return alert("Daten fehlen");
    const snap = await db.collection("users").where("email", "==", email).limit(1).get();
    if (snap.empty) return alert("User nicht gefunden");
    const docId = snap.docs[0].id;
    const uData = snap.docs[0].data().streakData || {};
    const dStr = formatDate(new Date(date + "T12:00:00"));
    if (val === "") delete uData[dStr]; else uData[dStr] = val;
    await db.collection("users").doc(docId).set({ streakData: uData }, { merge: true });
    alert("Erfolgreich für " + email + " gespeichert!");
}
